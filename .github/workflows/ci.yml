name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Prisma client and SQLite schema
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
