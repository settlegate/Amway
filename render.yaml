# Render Blueprint — 백엔드 API 서버 (Express + Prisma + node-cron)
# Render 대시보드 → New → Blueprint → 이 저장소 선택 시 이 파일로 서비스가 생성된다.
#
# 무료 플랜 구성: 컨테이너 파일시스템이 휘발성이라 SQLite 대신 외부 Postgres(Neon 무료)를 쓴다.
# - DATABASE_URL: Neon 대시보드에서 복사한 postgresql:// 연결 문자열을 Render env에 입력한다.
#   (풀러 없는 direct host 사용 — `prisma db push`가 pgbouncer와 호환되지 않는다)
# - prod용 스키마는 빌드 시 schema.prisma에서 provider만 postgresql로 바꿔 생성한다
#   (개발용 schema.prisma는 sqlite 그대로 유지).
# - 업로드 이미지(/uploads)는 컨테이너에 저장돼 재배포·재시작 시 사라진다.
#   영구 보존이 필요하면 plan: starter + disk(/var/data)로 전환하고
#   DATABASE_URL=file:/var/data/dev.db, UPLOAD_DIR=/var/data/uploads 로 바꾼다.
#
# 무료 플랜 주의: 15분 무방문 시 서비스가 슬립하고, 다음 요청은 콜드스타트(~30~60초)다.
# 카카오 웹훅·크론 뉴스레터는 슬립 중 지연될 수 있다.

services:
  - type: web
    name: joohee-newsletter-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    branch: main
    buildCommand: npm install --include=dev && sed 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma > prisma/schema.prod.prisma && npx prisma generate --schema prisma/schema.prod.prisma && npm run build && npx prisma db push --schema prisma/schema.prod.prisma
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon 대시보드의 connection string (postgresql://... ) — secret이라 저장소에 값을 두지 않는다
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://joohee-newsletter-roan.vercel.app
      - key: PUBLIC_API_URL
        value: https://joohee-newsletter-api.onrender.com
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # 아래 항목은 Blueprint 생성 후 Render 대시보드에서 직접 값을 입력한다.
      # 로컬 .env의 값을 그대로 옮기면 된다. (sync:false = 값을 저장소에 커밋하지 않음)
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: USER_SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KAKAO_CHANNEL_TOKEN
        sync: false
      - key: KAKAO_API_KEY
        sync: false
      - key: KAKAO_WEBHOOK_SECRET
        sync: false
      - key: A_CLIC_SPONSOR_ID
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
